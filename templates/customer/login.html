<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Fruit Detection AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #198754, #0d6efd);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 45px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🍎
    </div>

    <h2 class="text-center mb-2">
        Customer Login
    </h2>

    <p class="text-center text-muted mb-4">
        Fruit Detection AI
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Login
        </button>

    </form>


    <div class="text-center mt-4">

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

        <p>

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </p>

    </div>

</div>

</body>

</html>
