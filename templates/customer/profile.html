
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Fruit Detection AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('dashboard') }}"
        >
            🍎 Fruit Detection AI
        </a>

        <div>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-light btn-sm"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('customer_history') }}"
                class="btn btn-warning btn-sm"
            >
                History
            </a>

            <a
                href="{{ url_for('customer_logout') }}"
                class="btn btn-danger btn-sm"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        👤 My Profile
                    </h3>

                </div>


                <div class="card-body p-4">


                    <div class="text-center mb-4">

                        <div
                            class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                            style="width:100px;height:100px;font-size:45px;"
                        >
                            👤
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Name
                        </label>

                        <div class="form-control">
                            {{ customer['name'] }}
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Email
                        </label>

                        <div class="form-control">
                            {{ customer['email'] }}
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Username
                        </label>

                        <div class="form-control">
                            {{ customer['username'] }}
                        </div>

                    </div>


                    <div class="d-flex justify-content-center gap-2 mt-4">

                        <a
                            href="{{ url_for('customer_history') }}"
                            class="btn btn-dark"
                        >
                            📜 View History
                        </a>

                        <a
                            href="{{ url_for('predict') }}"
                            class="btn btn-success"
                        >
                            🍎 Make Prediction
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
