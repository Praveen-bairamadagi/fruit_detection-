<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">
            🍎 Fruit Detection AI
        </a>

        <div>

            <a class="btn btn-light btn-sm"
               href="{{ url_for('prediction') }}">
                Prediction
            </a>

            <a class="btn btn-warning btn-sm"
               href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center">

                        <div class="profile-icon">
                            👤
                        </div>

                        <h2 class="fw-bold mt-3">
                            My Profile
                        </h2>

                    </div>


                    <hr>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Full Name
                        </label>

                        <div class="profile-value">
                            {{ customer["name"] }}
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Email Address
                        </label>

                        <div class="profile-value">
                            {{ customer["email"] }}
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-bold">
                            Phone Number
                        </label>

                        <div class="profile-value">
                            {{ customer["phone"] or "Not provided" }}
                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="fw-bold">
                            Registered On
                        </label>

                        <div class="profile-value">
                            {{ customer["created_at"] }}
                        </div>

                    </div>


                    <div class="d-grid">

                        <a href="{{ url_for('prediction') }}"
                           class="btn btn-success">
                            Go to Prediction
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
