
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - Fruit Detection AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
            🍎 Fruit Detection AI
        </a>

        <a href="{{ url_for('login') }}" class="btn btn-light">
            Login
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0">Customer Registration</h3>
                </div>

                <div class="card-body p-4">

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-warning">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Choose a username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                required
                            >
                        </div>

                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-success btn-lg"
                            >
                                Create Account
                            </button>
                        </div>

                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="mb-0">
                            Already have an account?
                        </p>

                        <a
                            href="{{ url_for('login') }}"
                            class="text-success fw-bold"
                        >
                            Login here
                        </a>
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
