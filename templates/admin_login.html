
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Fruit Detection AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101820, #263746);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .login-header {
            background: #198754;
            color: white;
            padding: 28px 20px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-login {
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
        }

        .back-link {
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card login-card shadow-lg">

    <div class="login-header text-center">
        <div class="fs-1">🍎</div>
        <h2 class="fw-bold mb-1">Admin Login</h2>
        <p class="mb-0">Fruit Detection AI</p>
    </div>

    <div class="card-body p-4 p-md-5">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div
                        class="alert alert-{{ category }} alert-dismissible fade show"
                        role="alert"
                    >
                        {{ message }}
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"
                        ></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('admin_login') }}"
        >

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="btn btn-success btn-login w-100"
            >
                Login as Admin
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('home') }}" class="back-link text-success">
                &larr; Back to Home
            </a>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
            Authorized administrators only.
        </p>

    </div>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");

    toggleButton.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        toggleButton.textContent = isHidden ? "Hide" : "Show";
        toggleButton.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
        toggleButton.setAttribute("aria-pressed", String(isHidden));
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
