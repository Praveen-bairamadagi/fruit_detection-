<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Fruit Detection AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-dark d-flex align-items-center"
      style="min-height: 100vh;">


<div class="container">

    <div
        class="card shadow mx-auto"
        style="max-width: 450px;"
    >

        <div class="card-body p-5">

            <h2 class="text-center mb-2">
                🔐 Admin Login
            </h2>

            <p class="text-center text-muted">
                Fruit Detection AI
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Admin username"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-dark w-100"
                >
                    Login as Admin
                </button>

            </form>


            <div class="text-center mt-4">

                <p class="text-muted">
                    Default username: <strong>admin</strong>
                </p>

                <p class="text-muted">
                    Default password: <strong>admin123</strong>
                </p>

                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
